# ClusterRole unit tests.
#
# The rules come from templates/_rbac-rules.tpl, generated from the operator's
# +kubebuilder:rbac markers (make sync-helm-rbac); the rule shape follows
# controller-gen (resources with identical verbs merged, verbs sorted). This
# suite pins the rendering, the wiring of the generated rules into the
# ClusterRole, and the grants whose restriction is deliberate; it does not
# re-assert every generated rule.
suite: ClusterRole
templates:
  - templates/clusterrole.yaml
tests:
  - it: should grant full CRUD on controlplanes
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - c5c3.io
            resources:
              - controlplanes
              - credentialrotations
              - keystoneservices
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

  - it: should grant read-only on secretaggregates
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - c5c3.io
            resources:
              - secretaggregates
            verbs:
              - get
              - list
              - watch

  - it: should grant read-only access on keystoneidentitybackends
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - keystone.openstack.c5c3.io
            resources:
              - keystoneidentitybackends
            verbs:
              - get
              - list
              - watch
      - notContains:
          path: rules
          content:
            apiGroups:
              - keystone.openstack.c5c3.io
            resources:
              - keystoneidentitybackends
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

  # The Neutron child is projected and Owned, so it takes full CRUD; the
  # OVNCentral is deployed outside the plane and only referenced, so the operator
  # reads and watches it and must never be able to write it.
  - it: should grant full CRUD on neutrons and read-only access on ovncentrals
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - neutron.openstack.c5c3.io
            resources:
              - neutrons
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch
      - contains:
          path: rules
          content:
            apiGroups:
              - ovn.openstack.c5c3.io
            resources:
              - ovncentrals
            verbs:
              - get
              - list
              - watch
      - notContains:
          path: rules
          content:
            apiGroups:
              - ovn.openstack.c5c3.io
            resources:
              - ovncentrals
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

  # The dedicated OpenBao instance needs a Role/RoleBinding pair for the
  # barbican-operator's TokenRequest and a ClusterRoleBinding for the instance
  # pods' TokenReview, so the operator authors all three kinds. Both rules carry
  # the same narrowed verb set: no list/watch, because every read goes through
  # the uncached API reader rather than an informer, and no update, because
  # every write is a Server-Side Apply.
  - it: should grant get/create/patch/delete on roles and rolebindings
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - clusterrolebindings
              - rolebindings
              - roles
            verbs:
              - create
              - delete
              - get
              - patch

  - it: should grant get/create/patch/delete on clusterrolebindings
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - clusterrolebindings
              - rolebindings
              - roles
            verbs:
              - create
              - delete
              - get
              - patch
      - notContains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - clusterrolebindings
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

  - it: should grant bind on system:auth-delegator only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - clusterroles
            resourceNames:
              - system:auth-delegator
            verbs:
              - bind
      - notContains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - clusterroles
            verbs:
              - bind

  # reconcileDBCredentials uses CreateOrUpdate on a
  # per-ControlPlane externalsecret, which requires both create and update.
  # The full externalsecrets rule (which includes create and update) must be
  # present so the reconciler is permitted to CreateOrUpdate the ExternalSecret.
  - it: should allow create and update on externalsecrets so reconcileDBCredentials can CreateOrUpdate
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - external-secrets.io
            resources:
              - externalsecrets
              - pushsecrets
              - secretstores
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

  - it: should grant read-only on clustersecretstores
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - external-secrets.io
            resources:
              - clustersecretstores
            verbs:
              - get
              - list
              - watch

  # Kubernetes only lets an author grant permissions it holds itself, so the
  # operator needs create on the subresource to write the TokenRequest Role the
  # barbican-operator binds to.
  - it: should grant create on the serviceaccounts/token subresource
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - serviceaccounts/token
            verbs:
              - create

  - it: should grant get-only on endpointslices
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - discovery.k8s.io
            resources:
              - endpointslices
            verbs:
              - get
      - notContains:
          path: rules
          content:
            apiGroups:
              - discovery.k8s.io
            resources:
              - endpointslices
            verbs:
              - get
              - list
              - watch

  - it: should restrict events to create and patch only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - events
            verbs:
              - create
              - patch

  - it: should grant full CRUD on leases for leader election
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - coordination.k8s.io
            resources:
              - leases
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  # ClusterRole must not render in namespace-scoped mode.
  - it: should not render ClusterRole when rbac.namespaceScoped is true
    set:
      rbac:
        namespaceScoped: true
      webhook:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
