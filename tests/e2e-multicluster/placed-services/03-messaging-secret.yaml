# Brownfield transport-URL Secret for the neutron-mc CR.
#
# It is applied on the TARGET cluster while the CR that references it lives on
# the management one. The neutron-operator reads spec.messaging.secretRef
# through the CR's children client, which for a placed Neutron is the registered
# target's client, so a copy next to the CR would never be read.
#
# Neither cluster runs a broker, and nothing in the reconcile path dials one:
# the messaging step reads this Secret, checks that the URL parses with the
# rabbit scheme, and copies it into the derived Secret neutron-mc-transport-url,
# which the pods consume as OS_DEFAULT__TRANSPORT_URL. The host therefore points
# at the reserved .invalid TLD, which never resolves, so a code change that
# started connecting on the reconcile path fails here instead of passing
# quietly. Nothing else needs the broker: this Neutron drives OVN and runs no
# agent that would receive an RPC.
#
# The name is neutron-mc-messaging rather than neutron-mc-transport-url: the
# latter is the derived Secret the operator writes, and a fixture under that
# name would be overwritten on the first pass.
apiVersion: v1
kind: Secret
metadata:
  name: neutron-mc-messaging
  namespace: openstack
type: Opaque
stringData:
  transport_url: rabbit://neutron:neutron@rabbitmq.openstack.invalid:5672/
