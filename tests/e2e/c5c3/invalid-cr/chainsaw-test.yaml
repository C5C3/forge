# Chainsaw E2E tests for the ControlPlane External-mode validation matrix.
# Pins the type-level CEL XValidation rules and the validating webhook's
# cross-field / transition-gating rules in operators/c5c3/api/v1alpha1/ to
# deterministic admission failures against a real API server.
#
# Enforcement precedence at admission: the mutating (defaulting) webhook runs
# first, then the CRD schema validation (structural + enum + pattern + CEL),
# then the validating webhook. So an intra-struct violation (a managed-only
# field in External mode, external in Managed mode) is caught by CEL and the
# validating webhook never runs; a cross-field violation (infrastructure or
# horizon in External mode, a mode transition) that CEL cannot express is
# caught by the validating webhook. Each assertion below targets whichever
# layer owns the rule.
#
# Fixtures carry NO metadata.namespace: Chainsaw runs each Test in its own
# ephemeral namespace, isolating the one-ControlPlane-per-namespace webhook
# from the parallel c5c3 suites pinned to `openstack`, and letting the two
# accepted transition bases persist without colliding.
#
# All fixtures are generated from the single canonical scaffold in
# `_generate.py`. After editing the scaffold or any per-fixture override,
# regenerate via:
#   python3 tests/e2e/c5c3/invalid-cr/_generate.py
# CI runs `make verify-invalid-cr-fixtures`, which invokes `_generate.py
# --check` (drift mode, both directions incl. orphans) and `test_generate.py`
# (FIXTURES count + chainsaw-test.yaml cross-reference) so any hand-edit to a
# generated fixture fails the build before the cluster-bound e2e-operator job
# runs.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: c5c3-invalid-cr
spec:
  steps:
  # external set with explicit mode: Managed must be rejected (CEL).
  - try:
    - apply:
        file: 00-external-in-managed-explicit.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'may only be set when services.keystone.mode is External')): true
  # external set with mode unset (defaults Managed) must be rejected (CEL).
  - try:
    - apply:
        file: 01-external-in-managed-unset.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'may only be set when services.keystone.mode is External')): true
  # mode: External without the external block must be rejected (CEL).
  - try:
    - apply:
        file: 02-external-mode-without-external.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'external is required when services.keystone.mode is External')): true
  # spec.infrastructure in External mode must be rejected (webhook, cross-field).
  - try:
    - apply:
        file: 03-external-with-infrastructure.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'infrastructure')): true
            (contains($error, 'forbidden when services.keystone.mode is External')): true
  # services.horizon in External mode must be rejected (webhook, cross-field).
  - try:
    - apply:
        file: 04-external-with-horizon.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'horizon')): true
            (contains($error, 'forbidden when services.keystone.mode is External')): true
  # managed-only replicas in External mode must be rejected (CEL).
  - try:
    - apply:
        file: 05-external-replicas.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.keystone.replicas is forbidden when services.keystone.mode is External')): true
  # managed-only image in External mode must be rejected (CEL).
  - try:
    - apply:
        file: 06-external-image.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.keystone.image is forbidden when services.keystone.mode is External')): true
  # managed-only policyOverrides in External mode must be rejected (CEL).
  - try:
    - apply:
        file: 07-external-policy-overrides.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.keystone.policyOverrides is forbidden when services.keystone.mode is External')): true
  # managed-only rotationInterval in External mode must be rejected (CEL).
  - try:
    - apply:
        file: 08-external-rotation-interval.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.keystone.rotationInterval is forbidden when services.keystone.mode is External')): true
  # managed-only gateway in External mode must be rejected (CEL).
  - try:
    - apply:
        file: 09-external-gateway.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.keystone.gateway is forbidden when services.keystone.mode is External')): true
  # managed-only publicEndpoint in External mode must be rejected (CEL, P2).
  - try:
    - apply:
        file: 10-external-public-endpoint.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.keystone.publicEndpoint is forbidden when services.keystone.mode is External')): true
  # external without authURL must be rejected (CRD required field).
  - try:
    - apply:
        file: 11-external-authurl-missing.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'authURL')): true
  # external.authURL without an http(s) scheme must be rejected (CRD pattern).
  - try:
    - apply:
        file: 12-external-authurl-not-url.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'authURL')): true
  # external.endpointType outside the enum must be rejected (CRD enum).
  - try:
    - apply:
        file: 13-external-endpoint-type-invalid.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'endpointType')): true
  # external.caBundleSecretRef.name empty must be rejected (CRD MinLength).
  - try:
    - apply:
        file: 14-external-cabundle-empty-name.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'caBundleSecretRef')): true
  # services.keystone.federationProxyImage is a managed-only knob and must be
  # rejected in External mode, like every other managed-only field.
  - try:
    - apply:
        file: 19-federation-proxy-image-in-external.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'federationProxyImage')): true
  # services.horizon.publicEndpoint must be an http(s) URL: the WebSSO origin
  # derived from it is what Keystone matches verbatim.
  - try:
    - apply:
        file: 20-horizon-public-endpoint-not-a-url.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'publicEndpoint')): true
  # services.horizon.gateway.hostname must be a concrete DNS name. Gateway API
  # permits a wildcard here, but the WebSSO origin derived from it is compared
  # verbatim by Keystone and would match no dashboard.
  - try:
    - apply:
        file: 21-horizon-gateway-hostname-wildcard.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'gateway.hostname')): true
  # services.horizon.publicEndpoint must name the same host as the gateway
  # hostname: Django derives the origin it sends from the request Host header,
  # so a divergent host produces an origin Keystone rejects only after the user
  # has already authenticated at the identity provider.
  - try:
    - apply:
        file: 22-horizon-public-endpoint-host-mismatch.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'must equal services.horizon.gateway.hostname')): true
  # services.horizon.publicEndpoint must be a bare origin: the ^https?:// pattern
  # anchors only the prefix, so a query string passes the CRD gate and yields a
  # trusted origin Keystone accepts and never matches.
  - try:
    - apply:
        file: 23-horizon-public-endpoint-with-query.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'must be a bare origin')): true
  # identityServiceName carrying a comma must be rejected (CRD pattern): it is
  # cast to K-ORC's OpenStackName on the Service import filter, and OpenStack
  # list filters are comma-separated, which is why that pattern forbids one.
  - try:
    - apply:
        file: 29-external-catalog-identity-service-name-invalid.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'identityServiceName')): true
            (contains($error, 'should match')): true
  # services.keystone.dedicatedBackingServices in External mode must be rejected
  # (CEL): an External ControlPlane provisions no backing services at all, so
  # there is nothing to make dedicated.
  - try:
    - apply:
        file: 35-dedicated-in-external.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'dedicatedBackingServices is forbidden when services.keystone.mode is External')): true
  # An empty dedicatedBackingServices block requests no backing-service class and
  # must be rejected (CEL). Omitting the block entirely is how a service shares.
  - try:
    - apply:
        file: 36-dedicated-empty-block.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'must declare at least one backing-service class')): true
  # credentialsMode Dynamic on a DEDICATED database must be rejected by the
  # webhook: the OpenBao database engine carries one connection and role per
  # namespace, bootstrapped against the SHARED cluster, so no engine role can
  # issue credentials for a dedicated instance. CEL cannot catch it — clusterRef
  # IS set, so the Dynamic-requires-managed-mode rule passes.
  - try:
    - apply:
        file: 37-dedicated-database-dynamic-credentials.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'credentialsMode Dynamic is not supported on a dedicated database')): true
  # A two-replica DEDICATED database cannot hold Galera quorum, exactly as a
  # two-replica shared one cannot (webhook; the CRD marker only enforces
  # Minimum=1).
  - try:
    - apply:
        file: 38-dedicated-database-replicas-two.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, '2 cannot hold a majority')): true
  # Two services' dedicated caches naming the same managed clusterRef must be
  # rejected by the webhook: both would resolve to one Memcached child CR that the
  # two projections then fight over, voiding the isolation the opt-in exists for.
  - try:
    - apply:
        file: 39-dedicated-clusterref-collision.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'dedicatedBackingServices.cache.clusterRef.name')): true
            (contains($error, 'Duplicate')): true
    # A namespace assignment in External mode is rejected by the CEL rule: no
    # Keystone workload is deployed, so there is nothing to place.
    - apply:
        file: 42-namespace-in-external-mode.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.keystone.namespace')): true
    # Two services co-located in one namespace must agree on its lifecycle: they
    # share that namespace's backing services and its tenant store, so one
    # declaration must not have the teardown delete what the other declared
    # untouchable.
    - apply:
        file: 43-namespace-lifecycle-conflict.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'must declare the same lifecycle')): true
    # services.glance in External mode is rejected by the webhook (cross-field,
    # mirrors services.horizon): no Keystone workload is deployed, so Glance needs
    # its own External-mode design.
    - apply:
        file: 47-external-with-glance.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'glance')): true
            (contains($error, 'forbidden when services.keystone.mode is External')): true
    # services.glance.backends must declare at least one image store (CRD
    # MinItems): an empty list projects no GlanceBackend and Glance has no store.
    - apply:
        file: 48-glance-backends-empty.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'backends')): true
    # Exactly one backend must set isDefault (CEL): two defaults leave the Glance
    # default_backend ambiguous.
    - apply:
        file: 49-glance-two-defaults.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'exactly one backends entry must set isDefault')): true
    # A backend of type S3 must carry the s3 block (CEL union rule): the driver
    # parameters live there.
    - apply:
        file: 50-glance-s3-block-missing.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'the s3 block must be set exactly when type is S3')): true
    # services.glance.publicEndpoint must be an http(s) URL (CRD pattern,
    # mirroring services.keystone.publicEndpoint): the value is advertised
    # verbatim as the public image catalog Endpoint.
    - apply:
        file: 51-glance-public-endpoint-not-a-url.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'publicEndpoint')): true
    # services.glance.publicEndpoint must name the same host as the gateway
    # (webhook-only): the listener routes that hostname to the Glance API, so a
    # divergent host advertises a catalog endpoint that never reaches it.
    - apply:
        file: 52-glance-public-endpoint-host-mismatch.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'must equal services.glance.gateway.hostname')): true
    # services.glance.publicEndpoint must be a bare origin (webhook-only): the
    # pattern anchors only the prefix, and clients append the API path to the
    # catalog endpoint.
    - apply:
        file: 53-glance-public-endpoint-with-query.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'must be a bare origin')): true
    # services.keystone.databaseCredentialsMode in External mode is rejected by the
    # CEL rule: no managed database is provisioned, so there is no credentials mode
    # to override. Even a Static value is forbidden (the rule is a plain field forbid).
    - apply:
        file: 54-keystone-credentials-mode-override-in-external.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.keystone.databaseCredentialsMode is forbidden when services.keystone.mode is External')): true
    # databaseCredentialsMode Dynamic on the Keystone service with a DEDICATED database
    # is rejected by the webhook: the override retargets the shared database this
    # service does not use, and a dedicated database is Static-only. CEL cannot catch it
    # (the value passes the Enum, and no CEL rule spans the dedicated block).
    - apply:
        file: 55-keystone-override-dynamic-on-dedicated.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'Dynamic is not supported as an override on a service with a dedicated database')): true
    # databaseCredentialsMode Dynamic on the Glance service with a DEDICATED database is
    # rejected by the webhook, mirroring the keystone case above.
    - apply:
        file: 56-glance-override-dynamic-on-dedicated.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'Dynamic is not supported as an override on a service with a dedicated database')): true
    # databaseCredentialsMode Dynamic on a service using the SHARED database is rejected
    # by the webhook when that shared database is brownfield (no clusterRef), mirroring
    # the commonv1 Dynamic-requires-clusterRef contract one level up.
    - apply:
        file: 57-override-dynamic-on-brownfield.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'Dynamic requires the shared database to be managed')): true
    # spec.globalExtraConfig sets an unknown option (typo'd key) in a known
    # section: rejected by the webhook because it is absent from the keystone
    # 2025.2 option catalog, attributed back to the global block that carried it.
    - apply:
        file: 58-global-extraconfig-unknown-option.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'no such option in the keystone 2025.2 option catalog')): true
            (contains($error, 'spec.globalExtraConfig[token][providr]')): true
    # services.glance.extraConfig sets an unknown option in the known glance_store
    # section: rejected by the webhook because it is absent from the glance 2025.2
    # option catalog.
    - apply:
        file: 59-glance-extraconfig-unknown-option.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'no such option in the glance 2025.2 option catalog')): true
    # services.keystone.extraConfig in External mode is rejected by the CEL rule:
    # no Keystone workload is deployed, so there is no child config to project.
    - apply:
        file: 60-keystone-extraconfig-in-external.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.keystone.extraConfig is forbidden when services.keystone.mode is External')): true
    # SECRET_KEY in services.horizon.extraConfig is forbidden by the webhook
    # (Family A): it is managed via services.horizon.secretKeyRef.
    - apply:
        file: 61-horizon-extraconfig-secret-key.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'SECRET_KEY is managed via')): true
    # services.glance.importFiltering sets both allowedHosts and disallowedHosts:
    # rejected by the CEL mutual-exclusivity rule, because glance evaluates the
    # deny-list only while the allow-list is empty.
    - apply:
        file: 62-glance-importfiltering-allow-and-deny-hosts.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'allowedHosts and disallowedHosts are mutually exclusive')): true
    # services.glance.staging.sizeLimit of 0 is rejected by the webhook: a Quantity
    # is an int-or-string in the CRD schema and carries no Minimum marker, so no
    # schema rule can express this floor.
    - apply:
        file: 63-glance-staging-sizelimit-zero.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.glance.staging.sizeLimit')): true
            (contains($error, 'must be at least 1Mi')): true
    # services.glance.imageCache.sizeLimit of 0 is rejected by the same exported
    # glance validator, one field over: a Quantity is an int-or-string in the CRD
    # schema and carries no Minimum marker, so no schema rule can express this floor.
    - apply:
        file: 64-glance-imagecache-sizelimit-zero.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.glance.imageCache.sizeLimit')): true
            (contains($error, 'must be at least 1Mi')): true
    # A colon in a services.glance.importPlugins injected property name is rejected
    # by the same exported glance validator. A map key has no CRD schema
    # counterpart, so admission is the sole gate: the oslo Dict parser splits each
    # pair on its first colon, and the name would be truncated there.
    - apply:
        file: 65-glance-importplugins-inject-key-colon.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.glance.importPlugins.injectMetadata.properties')): true
            (contains($error, 'property name must not contain a colon')): true
    # services.placement in External mode is rejected by the webhook (cross-field,
    # mirrors services.glance): no Keystone workload is deployed, so Placement
    # needs its own External-mode design.
    - apply:
        file: 66-external-with-placement.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.placement')): true
            (contains($error, 'forbidden when services.keystone.mode is External')): true
    # services.placement.publicEndpoint must be an http(s) URL (CRD pattern,
    # mirroring services.glance.publicEndpoint): the value is advertised verbatim
    # as the public placement catalog Endpoint.
    - apply:
        file: 67-placement-public-endpoint-not-a-url.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.placement.publicEndpoint')): true
            (contains($error, 'should match')): true
    # services.placement.publicEndpoint must name the same host as the gateway
    # (webhook-only): the listener routes that hostname to the Placement API, so a
    # divergent host advertises a catalog endpoint that never reaches it.
    - apply:
        file: 68-placement-public-endpoint-host-mismatch.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.placement.publicEndpoint')): true
            (contains($error, 'must equal services.placement.gateway.hostname')): true
    # databaseCredentialsMode Dynamic on the Placement service with a DEDICATED
    # database is rejected by the webhook, mirroring the keystone and glance cases
    # above.
    - apply:
        file: 69-placement-override-dynamic-on-dedicated.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.placement.databaseCredentialsMode')): true
            (contains($error, 'Dynamic is not supported as an override on a service with a dedicated database')): true
    # services.barbican in External mode is rejected by the webhook (cross-field,
    # mirrors services.glance and services.placement): no Keystone workload is
    # deployed, so Barbican needs its own External-mode design.
    - apply:
        file: 70-external-with-barbican.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.barbican')): true
            (contains($error, 'forbidden when services.keystone.mode is External')): true
    # services.barbican.secretStore must name exactly one mode (CEL union rule):
    # dedicated and external address different servers with different credentials,
    # so a block naming both leaves the projection nothing to resolve.
    - apply:
        file: 71-barbican-secret-store-both-modes.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.barbican.secretStore')): true
            (contains($error, 'exactly one of dedicated or external must be set')): true
    # The other side of the same union rule: a store naming neither mode would
    # project a Barbican that parks on SecretStoresReady=False forever.
    - apply:
        file: 72-barbican-secret-store-no-mode.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.barbican.secretStore')): true
            (contains($error, 'exactly one of dedicated or external must be set')): true
    # An external secret store must be addressed over https (CRD pattern, stricter
    # than the ^https?:// the endpoint fields carry): the AppRole login and every
    # secret barbican stores travel that URL.
    - apply:
        file: 73-barbican-external-store-plaintext-url.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.barbican.secretStore.external.url')): true
            (contains($error, 'should match')): true
    # An empty credentialsSecretRef.name is rejected by the SecretNameRefSpec
    # MinLength marker, which answers before the webhook mirror does: the external
    # store authenticates with the AppRole credentials that Secret holds.
    - apply:
        file: 74-barbican-external-store-empty-credentials-name.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.barbican.secretStore.external.credentialsSecretRef.name')): true
            (contains($error, 'should be at least 1 chars long')): true
    # services.barbican.publicEndpoint must name the same host as the gateway
    # (webhook-only): the listener routes that hostname to the Barbican API, so a
    # divergent host advertises a catalog endpoint that never reaches it.
    - apply:
        file: 75-barbican-public-endpoint-host-mismatch.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.barbican.publicEndpoint')): true
            (contains($error, 'must equal services.barbican.gateway.hostname')): true
    # databaseCredentialsMode Dynamic on the Barbican service with a DEDICATED
    # database is rejected by the webhook, mirroring the keystone, glance, and
    # placement cases above.
    - apply:
        file: 76-barbican-override-dynamic-on-dedicated.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.barbican.databaseCredentialsMode')): true
            (contains($error, 'Dynamic is not supported as an override on a service with a dedicated database')): true
    # services.neutron in External mode is rejected by the webhook (cross-field,
    # mirroring its glance, placement and barbican siblings): no Keystone workload
    # is deployed, so Neutron needs its own External-mode design.
    - apply:
        file: 96-external-with-neutron.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.neutron')): true
            (contains($error, 'forbidden when services.keystone.mode is External')): true
    # The shared message bus is not optional for the network service (webhook-only):
    # the Neutron CRD requires spec.messaging, and the ControlPlane derives the
    # child's transport URL from spec.infrastructure.messaging.
    - apply:
        file: 97-neutron-without-messaging.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'infrastructure.messaging')): true
            (contains($error, 'is required when services.neutron is set')): true
    # An empty ovn.centralRef.name is rejected by the MinLength marker, which answers
    # before the webhook mirror in validateNeutron does: the ML2/OVN mechanism driver
    # has no Northbound database to program without a central.
    - apply:
        file: 98-neutron-ovn-centralref-name-empty.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.neutron.ovn.centralRef.name')): true
            (contains($error, 'should be at least 1 chars long')): true
    # services.neutron.publicEndpoint must name the same host as the gateway
    # (webhook-only): the listener routes that hostname to the Neutron API, so a
    # divergent host advertises a catalog endpoint that never reaches it.
    - apply:
        file: 99-neutron-public-endpoint-host-mismatch.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.neutron.publicEndpoint')): true
            (contains($error, 'must equal services.neutron.gateway.hostname')): true
    # databaseCredentialsMode Dynamic on the Neutron service with a DEDICATED
    # database is rejected by the webhook, mirroring the keystone, glance, placement,
    # and barbican cases above.
    - apply:
        file: 24-neutron-override-dynamic-on-dedicated.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.neutron.databaseCredentialsMode')): true
            (contains($error, 'Dynamic is not supported as an override on a service with a dedicated database')): true
    # The placed-catalog-service rule seen on the network service (webhook-only):
    # what the ControlPlane would otherwise register for Neutron is an in-cluster
    # Service DNS name that resolves nowhere from another cluster.
    - apply:
        file: 25-placed-neutron-unpublished.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.neutron.publicEndpoint')): true
            (contains($error, 'one of publicEndpoint or gateway is required when targetClusterRef is set')): true
    # A 33-character ControlPlane name would project a 41-character Neutron child,
    # one over the 40 the Neutron CRD admits. The webhook rejects it up front
    # (create-only): metadata.name is immutable, so an admitted CR never recovers.
    - apply:
        file: 26-neutron-name-too-long.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'the projected Neutron child CR name would be 41 characters')): true
    # An OVNCentral in a namespace the ControlPlane neither owns nor claims is
    # refused (webhook-only): the neutron-operator mirrors that central's client
    # Secret into the Neutron namespace, so the reference alone would hand this
    # plane an mTLS identity for another plane's OVN databases. The anchor stops
    # short of the apostrophe in "ControlPlane's": a JMESPath string literal is
    # single-quoted (a double-quoted token is an identifier lookup, which reads
    # false against $error), and the validation-parity audit takes each anchor
    # up to the next single quote, so the apostrophe cannot be escaped either.
    - apply:
        file: 27-neutron-ovn-central-foreign-namespace.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.neutron.ovn.centralRef.namespace')): true
            (contains($error, 'is neither this ControlPlane')): true
    # A target cluster on an External-mode keystone is rejected by the CEL rule,
    # like every other managed-only field: no Keystone workload is deployed, so
    # there is nothing to place.
    - apply:
        file: 79-target-cluster-in-external-mode.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.keystone.targetClusterRef is forbidden when services.keystone.mode is External')): true
    # An empty targetClusterRef.name is rejected by the shared TargetClusterRefSpec
    # MinLength marker, which answers before the webhook mirror in
    # validation.TargetClusterRef does: a ref that names no cluster resolves nowhere.
    - apply:
        file: 80-target-cluster-empty-name.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.keystone.targetClusterRef.name')): true
            (contains($error, 'should be at least 1 chars long')): true
    # A placed service must declare a namespace of its own (webhook-only): every
    # namespace maps to exactly one cluster and the ControlPlane's own stays on the
    # local one, so the database, tenant store, and credential material of a placed
    # service without a block would live on another cluster than its workload.
    - apply:
        file: 81-placed-service-without-namespace.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.keystone.namespace')): true
            (contains($error, 'is required when targetClusterRef is set')): true
    # A placed CATALOG service must advertise a publicEndpoint or a gateway
    # (webhook-only): what the ControlPlane would otherwise register is an
    # in-cluster Service DNS name that resolves nowhere from another cluster.
    - apply:
        file: 82-placed-glance-unpublished.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.glance.publicEndpoint')): true
            (contains($error, 'one of publicEndpoint or gateway is required when targetClusterRef is set')): true
    # Two services co-located in one namespace must name the same target cluster:
    # the namespace exists on exactly one cluster, together with the backing
    # services, the tenant store, and the credential material scoped to it.
    - apply:
        file: 83-target-cluster-disagreement.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.glance.targetClusterRef')): true
            (contains($error, 'must be placed on the same target cluster')): true
    # Keystone itself must be published as soon as another service is placed away
    # from it: that service validates its tokens against Keystone over the public
    # URL, and an empty spec.keystoneEndpoint on the projected child is refused by
    # the child's own CRD on every pass.
    - apply:
        file: 86-placed-service-unpublished-keystone.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.keystone.publicEndpoint')): true
            (contains($error, 'is required when another service is placed on a target cluster')): true
    # Once a cluster boundary separates Keystone from any service — here Keystone
    # itself is the one placed — its publicEndpoint becomes the auth_url the
    # operator renders the admin password and every service-account password next
    # to, and those credentials cross that boundary to reach it, so http:// is
    # refused.
    - apply:
        file: 87-placed-keystone-plaintext-endpoint.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'services.keystone.publicEndpoint')): true
            (contains($error, 'must use scheme https when any service is placed away from Keystone')): true
  # An allowedNamespaces entry outside the RFC-1123 label shape names no
  # namespace the gate could ever admit a registration from (CRD items pattern).
  - try:
    - apply:
        file: 88-registration-namespace-invalid.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'allowedNamespaces[0]')): true
            (contains($error, 'should match')): true
  # Consent is a set: a namespace listed twice is rejected by the apiserver's
  # listType=set semantics, so no duplicate can survive the edit that revokes it.
  - try:
    - apply:
        file: 89-registration-namespace-duplicate.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'allowedNamespaces')): true
            (contains($error, 'Duplicate value')): true
  # The shared message bus is either managed (clusterRef, a RabbitmqCluster the
  # ControlPlane provisions) or brownfield (secretRef, a transport URL read off a
  # Secret). Naming both leaves the reconciler no way to decide which broker the
  # control plane talks to, so the type-level CEL rule on commonv1.MessagingSpec
  # rejects it.
  - try:
    - apply:
        file: 90-messaging-both-modes.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'exactly one of clusterRef or secretRef must be set')): true
  # A brownfield ref naming no Secret addresses no broker at all. The shared
  # SecretRefSpec.Name carries MinLength=1, so the CRD schema rejects it before
  # the webhook mirror runs.
  - try:
    - apply:
        file: 91-messaging-secretref-empty-name.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.infrastructure.messaging.secretRef.name')): true
  # messaging.tls carries CLIENT trust only, and the reconciler projects nothing
  # but spec.replicas onto the owned RabbitmqCluster, so a MANAGED broker comes up
  # on the operator's default, plaintext listener. Admitting tls beside a
  # clusterRef would promise an encrypted connection nothing provisions.
  - try:
    - apply:
        file: 92-messaging-tls-in-managed-mode.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'tls is supported in brownfield mode only')): true
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  # Own ephemeral namespace so the accepted base persists (see the sibling
  # transition waves).
  name: c5c3-invalid-cr-shared-to-dedicated
spec:
  steps:
  - try:
    # Base CR (Managed, sharing the ControlPlane-wide backing services — the
    # default) must be admitted.
    - apply:
        file: 40-transition-base-shared.yaml
    # Moving the live service onto dedicated backing services is rejected: the
    # flip would re-point the consuming child's immutable database fields at a
    # different instance while the previously-provisioned one keeps running with
    # the data still on it. Webhook-only (no CEL transition rule), so a later
    # transition feature can relax the freeze to a gated migration.
    - apply:
        file: 41-transition-to-dedicated.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'switching a service between shared and dedicated backing services')): true
