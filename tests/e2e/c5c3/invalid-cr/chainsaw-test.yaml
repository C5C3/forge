  # Own ephemeral namespace so the accepted base persists (see the sibling
  # transition waves).
  name: c5c3-invalid-cr-barbican-store-freeze
spec:
  steps:
  - try:
    # Base CR (Managed, Barbican on the dedicated secret store the operator
    # provisions) must be admitted.
    - apply:
        file: 77-transition-base-barbican-dedicated.yaml
    # Flipping the live store onto an external server is rejected: the secret
    # material already written lives on the server the current mode names, and
    # the flip would both re-point the store at a different server and strand the
    # OpenBao instance, its raft volume, and its seal key behind it.
    - apply:
        file: 78-transition-barbican-store-to-external.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'secret-store mode (dedicated vs external) is immutable')): true
