apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  # Own ephemeral namespace so the accepted base persists (see the sibling
  # transition waves).
  name: c5c3-invalid-cr-messaging-freeze
spec:
  steps:
  - try:
    # Base CR (Managed, declaring the shared message bus in brownfield mode) must
    # be admitted. Brownfield throughout, so the base provisions nothing and
    # leaves no side effects for the rejection steps to clean up, while still
    # carrying a declared messaging block to freeze.
    - apply:
        file: 93-transition-base-messaging.yaml
    # Flipping the live block from brownfield onto a managed clusterRef is
    # rejected: the two modes address different brokers, so the flip would
    # re-point every consumer at a freshly provisioned, empty RabbitmqCluster
    # while the queues in use stay on the brownfield one.
    - apply:
        file: 94-transition-messaging-mode-flip.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'messaging mode (managed clusterRef vs brownfield secretRef) is immutable')): true
    # Dropping a BROWNFIELD messaging block is rejected too: admitting it would
    # launder the mode freeze above into a two-step flip (null the block, then
    # re-add it with a clusterRef as an ordinary opt-in), landing on exactly the
    # state the previous step rejects without a single admission error. The
    # MANAGED removal is the same rule from the other side; the
    # tests/e2e/c5c3/messaging suite pins it against a live owned broker.
    - apply:
        file: 95-transition-remove-messaging.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'cannot be removed once declared')): true
