  steps:
  - try:
    # Base CR (Managed, Keystone in a pre-existing namespace it does not own and
    # published, but on no target cluster) must be admitted. The External
    # lifecycle means the operator never creates that namespace, so the CR parks
    # on NamespaceNotFound and provisions nothing — no side effects for the
    # rejection step to clean up.
    - apply:
        file: 84-transition-base-unplaced.yaml
    # Placing the live service on a target cluster is rejected: the assignment is
    # create-only, because re-pointing a live service strands its workload, its
    # database, and the material in its tenant store on the cluster it came from.
    - apply:
        file: 85-transition-add-target-cluster.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'targetClusterRef is immutable')): true
