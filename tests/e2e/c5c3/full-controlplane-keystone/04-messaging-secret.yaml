# Brownfield transport-URL Secret the ControlPlane's spec.infrastructure.messaging
# references.
#
# The e2e cluster runs no broker. Nothing in the reconcile path dials one: the
# ControlPlane reads this Secret and copies its URL into the delivered Secret
# controlplane-keystone-neutron-messaging the projected Neutron consumes, and
# the neutron-operator copies that into its derived transport-url Secret, which
# the pods consume as OS_DEFAULT__TRANSPORT_URL. The host therefore points at
# the reserved .invalid TLD, which never resolves, so a code change that started
# connecting on the reconcile path fails here instead of passing quietly. The
# network round trip in 01-openstack-verify-job.yaml runs against the same
# unreachable URL the tempest network leg (tests/tempest/neutron-*/) uses.
#
# A managed clusterRef is not used here: the RabbitMQ Cluster Operator defaults
# the broker pod to a 1 CPU / 2Gi request, which does not fit the single 4-vCPU
# CI node beside the other five services and the OVN control plane. The managed
# projection is what tests/e2e/c5c3/messaging/ proves.
apiVersion: v1
kind: Secret
metadata:
  name: controlplane-keystone-messaging
  namespace: openstack
type: Opaque
stringData:
  transport_url: rabbit://neutron:neutron@rabbitmq.openstack.invalid:5672/
