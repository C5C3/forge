# ControlPlane CR fixture for the full-controlplane-keystone E2E test. It drives
# SIX services (keystone, horizon, glance, placement, barbican, and neutron)
# through the full chain.
#
# Managed mode: database and cache reference managed clusters by clusterRef, so
# the c5c3-operator reconcileInfrastructure sub-reconciler projects an owned
# MariaDB ("openstack-db") and Memcached ("openstack-memcached") in the
# ControlPlane's own namespace (openstack). These are the same cluster names the
# deploy stack provisions (deploy/flux-system/infrastructure/), so the chain
# reads against the production-shaped infrastructure.
#
# The K-ORC admin credential is (re-)minted from the admin password. In managed
# mode (this CR sets infrastructure.database.clusterRef) the c5c3-operator
# projects that password into the per-ControlPlane Secret
# "controlplane-keystone-keystone-admin-credentials" from the OpenBao bootstrap
# path bootstrap/openstack/controlplane-keystone-keystone/admin
# (reconcileAdminPassword); the korc.adminCredential.passwordSecretRef below is a
# required-but-unused placeholder in managed mode (effectiveAdminPasswordSecretRef
# overrides it with the projected Secret). The minted application credential is
# mirrored to OpenBao and read back into the per-CR k-orc-clouds-yaml Secret in
# this CR's own namespace (openstack). restricted:true keeps the credential
# least-privilege so a leak is scoped.
#
# the FIRST authentication uses a password-based clouds.yaml
# that the c5c3-operator now SEEDS ITSELF (seedBootstrapCloudsYAML, write-if-
# empty) into the controlplane-keystone-admin-app-credential Secret at reconcile
# time — it is no longer pre-seeded by deploy tooling ahead of this CR. The seed
# never clobbers a minted credential-based clouds.yaml. The per-CR
# k-orc-clouds-yaml ExternalSecret in this CR's own namespace (openstack) is
# likewise OPERATOR-CREATED (ensureKORCCloudsYAMLExternalSecret), reading the
# per-CR OpenBao path. There is no orc-system copy and K-ORC has no
# globalCloudConfig mount: it resolves each CR's cloudCredentialsRef in the CR's
# own namespace (the C1 co-location), so the openstack-namespace Secret is the
# only clouds.yaml the chain needs.
#
# `global.rules` carries one oslo.policy override so the test can assert that the
# reconciler merges policy into the projected Keystone CR's spec.policyOverrides
# (the per-service override path is left empty here so the global rule wins).
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: controlplane-keystone
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  region: RegionOne
  # Single-replica topology across database, cache, and the Keystone Deployment
  # so the full fresh-create chain schedules on a single-node kind cluster.
  # database.replicas:1 drives the operator's fresh-create MariaDB projection to
  # a single-instance non-Galera MariaDB; cache.replicas:1 to a single Memcached
  # pod; services.keystone.replicas:1 to a single API pod. database.storageSize is
  # pinned to 512Mi so the projected MariaDB requests a test-sized volume instead
  # of the 100Gi CRD default (the production baseline) that CI never fills.
  infrastructure:
    database:
      clusterRef:
        name: openstack-db
      database: keystone
      secretRef:
        name: keystone-db
      replicas: 1
      storageSize: 512Mi
    cache:
      clusterRef:
        name: openstack-memcached
      backend: dogpile.cache.pymemcache
      replicas: 1
    # The shared message bus, referenced brownfield. The network service is its
    # first consumer: the Neutron CRD requires spec.messaging, and the
    # ControlPlane derives the child's transport URL from this block, so the
    # webhook requires it beside services.neutron. The Secret is
    # 04-messaging-secret.yaml, applied beside this CR with a placeholder URL.
    # A managed clusterRef would project a RabbitmqCluster whose pod requests
    # the RabbitMQ Cluster Operator's default 1 CPU and 2Gi, which does not fit
    # the single 4-vCPU CI node beside the other five services and the OVN
    # control plane (the keystone db-sync Job and OVN northd never scheduled).
    # The managed projection is what tests/e2e/c5c3/messaging/ proves.
    messaging:
      secretRef:
        name: controlplane-keystone-messaging
  services:
    keystone:
      replicas: 1
    # Horizon: single dashboard replica; the secretKeyRef override points at
    # the per-CP ExternalSecret this suite applies
    # (02-horizon-secret-key-externalsecret.yaml) — the documented
    # multi-ControlPlane path, since the kind shim Secret is pinned to the
    # default identity.
    horizon:
      replicas: 1
      secretKeyRef:
        name: controlplane-keystone-horizon-secret-key
        key: secret-key
    # single-replica Glance against the Garage S3 bucket the deploy stack
    # provisions (deploy/flux-system/infrastructure/garage.yaml, ESO-synced
    # garage-s3-credentials Secret in the openstack namespace).
    glance:
      replicas: 1
      backends:
        - name: default
          type: S3
          isDefault: true
          s3:
            endpoint: "http://garage.shared-services.svc.cluster.local:3900"
            bucket: glance-images
            region: garage
            credentialsSecretRef:
              name: garage-s3-credentials
    # Placement takes the bare shape Keystone does: it needs no backends and no
    # extra blocks, so a single API replica against the shared database and cache
    # is the whole declaration.
    placement:
      replicas: 1
    # Barbican takes a DEDICATED secret store, so the c5c3-operator provisions an
    # OpenBao instance of its own beside the child and attaches the store to it.
    # That is the point of declaring it here: the suite then exercises the whole
    # projected instance chain (instance, store, minted AppRole, secret
    # round-trip) rather than a server run outside this control plane. In the
    # openstack namespace the kind overlay's proving tenant already admits the
    # namespace to the openbao-operator, so no ControlPlane-owned OpenBaoTenant
    # is created beside the instance.
    barbican:
      replicas: 1
      secretStore:
        dedicated: {}
    # The network service. Its central is the standalone OVNCentral that
    # 03-ovncentral-cr.yaml applies beside this CR; the ControlPlane only reads
    # that CR's readiness and never owns it. The centralRef namespace is left
    # empty and defaults to the ControlPlane's own (openstack). workerReplicas
    # sizes both RPC worker Deployments, so 1 keeps two worker pods on this
    # single node instead of the six the CRD default would schedule.
    neutron:
      replicas: 1
      workerReplicas: 1
      ovn:
        centralRef:
          name: controlplane-keystone-ovn
  globalPolicyOverrides:
    rules:
      "identity:list_users": "role:admin"
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
        secretName: k-orc-clouds-yaml
      passwordSecretRef:
        name: keystone-admin
        key: password
      applicationCredential:
        restricted: true
        rotation:
          mode: PasswordDriven
    # NOTE: Each declared service registers through a KeystoneService child the
    # c5c3-operator projects for it (controlplane-keystone-glance, -placement,
    # -barbican and -neutron, one per service, in that service's namespace),
    # carrying both the service's catalog entry and its service account. The
    # account is the user glance / placement / barbican / neutron in a Keystone
    # project of its own (service-glance, service-placement, service-barbican,
    # service-neutron, created by the registration) bound to the "service" role,
    # which Keystone's SRBAC default for identity:validate_token requires. The
    # registration delivers the account's credentials as the Secret
    # <child>-credentials beside the service, and the service child reads its
    # service-user password from there. Exercising that projection on a live
    # cluster is the point: each role projects as one unmanaged K-ORC Role import
    # plus one managed RoleAssignment; the chainsaw link asserts the four
    # children reach Ready and that the K-ORC rows they label-own are Available,
    # and the verify Job asserts the role is listed against each user in
    # Keystone.
